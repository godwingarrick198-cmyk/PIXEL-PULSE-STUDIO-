services:
  - type: web
    name: pixel-pulse-presenton
    runtime: image
    image:
      url: ghcr.io/presenton/presenton:latest
    plan: free
    healthCheckPath: /
    envVars:
      - key: LLM
        value: google
      - key: GOOGLE_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: gemini_flash
      - key: CAN_CHANGE_KEYS
        value: "false"
      - key: DISABLE_ANONYMOUS_TRACKING
        value: "true"
      - key: PRESENTATION_GENERATION_MODE
        value: standard
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        sync: false
